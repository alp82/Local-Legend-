# The Legend map tile worker in production: one container on a shared host, with hard limits
# so it can't starve the host's other stacks, and no way out but an allow-list proxy.
# Runbook: docs/legend-map-deploy.md.
#
# Rendered by deploy/render-deploy.mjs from 76f388d17c5c900cb6328bddc95e2d1270e81491 (https://github.com/alp82/Local-Legend-/actions/runs/45948913579). Don't edit this branch.
#
# Deployed by Coolify as a Git-based Docker Compose application in raw mode ("deploy file as-is"),
# from the legend-map-deploy branch: there deploy/render-deploy.mjs has pinned the worker
# image to the digest a release run built and attested, so a moved tag never changes what runs.
# Coolify pulls the images and runs that file unchanged. Raw mode matters: without it Coolify
# joins every service to every network and to its own bridge network, which would give the
# worker a way round the egress proxy, and hands every variable to every container. So:
# - images only, from the registry (no build), the worker's by digest;
# - the worker's credentials come from a file on the host (worker.env, chmod 600), never from
#   Coolify, so the renderer password stays on the host;
# - the frozen source data is an external volume with a fixed name: it outlives every deploy,
#   and Coolify never manages or deletes it;
# - no domain, no proxy labels, no published ports.
#
# Variables (Coolify's Environment Variables, or .env next to this file without Coolify):
#   LEGEND_MAP_SUPABASE_HOST    <project ref>.supabase.co, for the egress allow-list (required)
#   LEGEND_MAP_RENDERER_DIR     the host folder with worker.env (default /opt/legend-map-renderer)
#   LEGEND_MAP_RENDERER_IMAGE   the worker image; on the deploy branch it's pinned by digest in place
#                            (deploy/ship.sh sets a locally loaded image instead)
#   LEGEND_MAP_EGRESS_SCRIPT    the egress proxy script (default the repository's; the deploy branch and
#                            deploy/ship.sh put it next to this file)
#   LEGEND_MAP_RENDERER_MEMORY  memory limit (default 3g)
name: legend-map-renderer

services:
  worker:
    image: ghcr.io/alp82/local-legend-map-renderer@sha256:411b5fe68f55c2d12776ee17251573c57f82f36f0d301f98af866c6f10610bf9
    restart: unless-stopped
    env_file: ${LEGEND_MAP_RENDERER_DIR:-/opt/legend-map-renderer}/worker.env
    environment:
      SOURCE_CACHE_DIR: /data/source
      HEARTBEAT_FILE: /tmp/legend-map-worker-heartbeat.json
      # One painter. Measured with the round 11 painter on dense Manhattan (100 tiles, 2 CPUs):
      # its page alone peaks at about 2.4 GB and the container at about 3.2 GB; 0.8 to 1.1 s per
      # tile on a fast desktop core. A second painter doesn't fit.
      PAINT_WORKERS: "1"
      # The painter's caches only grow: replace the page every 100 tiles.
      RECYCLE_TILES: "100"
      LEASE_BATCH: "4"
      IDLE_POLL_MS: "1000"
      # Close Chromium after a minute with nothing to paint: idle, it would keep about 2 GB of
      # this shared host's memory. The next lease launches it again (a few seconds).
      IDLE_RELEASE_MS: "60000"
      # The frozen source store stops growing at 8 GB, and upstream fetches stop for the day
      # after 20,000 (a new area costs about 150 to 300), at most 6 at a time.
      SOURCE_MAX_MB: "8000"
      SOURCE_FETCHES_PER_DAY: "20000"
      SOURCE_FETCH_CONCURRENCY: "6"
      # Every outbound request goes through the egress proxy; the painter's own page talks
      # only to its local server.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: 127.0.0.1,localhost
    volumes:
      # Frozen OpenFreeMap and terrain tiles. Keep this volume: deleting it lets map changes
      # in, and new tiles can then disagree with older neighbours at their edges.
      - source:/data
    networks:
      - inside
    depends_on:
      - egress
    # No ports.
    cpus: 2
    # 3 GB (the default, the owner's choice for this shared host): Chromium is restarted about
    # once per 100 dense-city tiles and the tile painted again. 4 GB had no restarts.
    mem_limit: ${LEGEND_MAP_RENDERER_MEMORY:-3g}
    memswap_limit: ${LEGEND_MAP_RENDERER_MEMORY:-3g}
    pids_limit: 1024
    shm_size: 1gb # Chromium's shared memory
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "src/health.mjs", "180"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The worker's only way out (src/egress-proxy.mjs): CONNECT to these hosts on 443, never to
  # a private, loopback or link-local address, so the worker can't reach the other machines
  # on the host's private network.
  #
  # Its own image (official Node, pinned by digest), running the proxy script from the deployed
  # checkout of this repository, never from the release image: a bad release can't widen its own
  # way out.
  egress:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    user: node
    # EGRESS_SCRIPT (src/egress-proxy.mjs of this commit) is written to a tmpfs and run; the root file
    # system stays read-only
    command: ["sh", "-c", "printf '%s' \"$$EGRESS_SCRIPT\" > /egress/egress-proxy.mjs && exec node /egress/egress-proxy.mjs"]
    tmpfs:
      - /egress:uid=1000,gid=1000,mode=0700,size=1m
    restart: unless-stopped
    environment:
      EGRESS_ALLOW: ${LEGEND_MAP_SUPABASE_HOST:?},tiles.openfreemap.org,elevation-tiles-prod.s3.amazonaws.com
      EGRESS_SCRIPT: |
        #!/usr/bin/env node
        // The worker's only way out: an HTTPS (CONNECT) proxy that lets through exactly the hosts
        // in EGRESS_ALLOW, on port 443, and never a private, loopback or link-local address. The
        // worker container sits on a Docker network with no route out (deploy/compose.yaml); this
        // proxy sits on that network and on the outside one. The host the worker runs on shares a
        // private network with other machines, which the worker therefore can't reach.
        //
        // Each name is resolved here and the connection goes to the address that was checked, so a
        // DNS answer can't switch it to a private address in between.
        //
        //   EGRESS_ALLOW=<project>.supabase.co,tiles.openfreemap.org,elevation-tiles-prod.s3.amazonaws.com node src/egress-proxy.mjs
        import { lookup } from 'node:dns/promises';
        import { createServer } from 'node:http';
        import { BlockList, isIP, connect } from 'node:net';

        const PORT = Number(process.env.EGRESS_PORT || 3128);
        const allow = new Set((process.env.EGRESS_ALLOW || '').split(',').map((h) => h.trim().toLowerCase()).filter(Boolean));

        const blocked = new BlockList();
        for (const [net, bits] of [['0.0.0.0', 8], ['10.0.0.0', 8], ['100.64.0.0', 10], ['127.0.0.0', 8], ['169.254.0.0', 16],
          ['172.16.0.0', 12], ['192.0.0.0', 24], ['192.168.0.0', 16], ['198.18.0.0', 15], ['224.0.0.0', 4], ['240.0.0.0', 4]]) {
          blocked.addSubnet(net, bits, 'ipv4');
        }
        // (No ::ffff:0:0/96 rule: BlockList checks plain IPv4 addresses against it too.)
        for (const [net, bits] of [['::', 128], ['::1', 128], ['fc00::', 7], ['fe80::', 10], ['ff00::', 8]]) {
          blocked.addSubnet(net, bits, 'ipv6');
        }
        const isPrivate = (address) => blocked.check(address, isIP(address) === 6 ? 'ipv6' : 'ipv4');

        /** The address to connect to for host:port, or the reason it is refused. */
        export async function resolveAllowed(host, port, allowed = allow) {
          const name = String(host).toLowerCase().replace(/^\[|\]$$/g, '');
          if (Number(port) !== 443) return { refused: `port $${port} not allowed` };
          if (isIP(name)) return { refused: 'addresses are not allowed, only names' };
          if (!allowed.has(name)) return { refused: `$${name} is not on the allow list` };
          // IPv4 first: containers often have no IPv6 route.
          const addresses = (await lookup(name, { all: true }).catch(() => [])).sort((a, b) => a.family - b.family);
          if (!addresses.length) return { refused: `$${name} does not resolve` };
          const ok = addresses.find((a) => !isPrivate(a.address));
          if (!ok) return { refused: `$${name} resolves only to private addresses` };
          return { address: ok.address };
        }

        const log = (msg) => console.log(`$${new Date().toISOString()} egress $${msg}`);

        const server = createServer((req, res) => {
          // Plain HTTP is never forwarded: everything the worker needs is HTTPS.
          res.writeHead(403).end('only CONNECT to allowed hosts on port 443\n');
        });

        server.on('connect', async (req, client, head) => {
          const [host, port] = String(req.url).split(/:(?=\d+$$)/);
          const r = await resolveAllowed(host, port);
          if (r.refused) {
            log(`refused $${req.url}: $${r.refused}`);
            client.end('HTTP/1.1 403 Forbidden\r\n\r\n');
            return;
          }
          const upstream = connect(Number(port), r.address, () => {
            client.write('HTTP/1.1 200 Connection Established\r\n\r\n');
            if (head?.length) upstream.write(head);
            upstream.pipe(client);
            client.pipe(upstream);
          });
          upstream.on('error', () => client.destroy());
          client.on('error', () => upstream.destroy());
        });

        if (import.meta.url === `file://$${process.argv[1]}`) {
          if (!allow.size) throw new Error('EGRESS_ALLOW is empty');
          server.listen(PORT, '0.0.0.0', () => log(`listening on $${PORT}, allowing $${[...allow].join(', ')}`));
        }
        export { server, isPrivate };
    networks:
      - inside
      - outside
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # No route out of this network: the worker reaches only the egress proxy. "isolated" also
  # leaves the bridge without an address on the host, so the worker can't reach services
  # listening on the host itself (an internal network otherwise gets one: Docker 28.0
  # release notes). Needs Docker 28.0 or later; older engines ignore it, so the runbook
  # checks the version and src/egress-check.mjs proves it from inside after every deploy.
  inside:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  outside: {}

volumes:
  # Created once on the host (docker volume create legend-map-renderer-source); the first manual
  # deployment already did. External: no deploy ever recreates, renames or deletes it.
  source:
    external: true
    name: legend-map-renderer-source
